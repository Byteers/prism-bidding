<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRism — Live Auction</title>
<link rel="stylesheet" href="/assets/css/base.css">
<style>
.login-page {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:40px 20px;
}
.hero { text-align:center; margin-bottom:40px; }
.hero-title {
  font-family:var(--font-d); font-size:clamp(4.5rem,12vw,7.5rem);
  letter-spacing:6px; line-height:.9;
  background:linear-gradient(135deg,var(--blue) 0%,#60a5fa 50%,var(--amber) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero-sub { font-family:var(--font-mono); font-size:.72rem; letter-spacing:4px; color:var(--text3); margin-top:14px; }

.room-label { font-family:var(--font-mono); font-size:.6rem; letter-spacing:3px; color:var(--text3); text-align:center; margin-bottom:14px; text-transform:uppercase; }
.room-selector { display:flex; gap:10px; justify-content:center; margin-bottom:28px; }
.room-btn {
  font-family:var(--font-mono); font-size:.68rem; letter-spacing:2px;
  padding:10px 32px; border-radius:100px; cursor:pointer;
  border:1px solid var(--border2); background:var(--bg2); color:var(--text3);
  transition:all .2s; text-transform:uppercase;
}
.room-btn.active { background:var(--blue-dim); border-color:var(--blue); color:var(--blue); }

.login-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; width:100%; max-width:680px; }
@media(max-width:580px){ .login-grid{grid-template-columns:1fr;} }

.login-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:28px 24px;
  transition:border-color .3s, box-shadow .3s;
}
.login-card:hover { border-color:var(--border2); box-shadow:0 8px 40px rgba(0,0,0,.4); }
.login-card-icon { font-size:1.8rem; margin-bottom:10px; display:block; }
.login-card h2   { font-size:1rem; font-weight:700; margin-bottom:4px; }
.login-card p    { font-family:var(--font-mono); font-size:.62rem; color:var(--text3); margin-bottom:20px; line-height:1.6; }
.err { font-family:var(--font-mono); font-size:.62rem; color:var(--red); min-height:16px; margin-top:6px; }

.display-links { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
</style>
</head>
<body>
<div class="page">
<div class="login-page">

  <div class="hero">
    <div class="hero-title">PRism</div>
    <div class="hero-sub">Live Auction Platform · College Edition</div>
  </div>

  <div class="room-label">Select Your Classroom</div>
  <div class="room-selector">
    <div class="room-btn active" id="btn-a" onclick="selectRoom('a')">🏫 Room A</div>
    <div class="room-btn"       id="btn-b" onclick="selectRoom('b')">🏫 Room B</div>
  </div>

  <div class="login-grid">

    <!-- TEAM LOGIN -->
    <div class="login-card">
      <span class="login-card-icon">🏷️</span>
      <h2>Team Login</h2>
      <p id="team-sub">Room A teams — enter your team ID and password</p>
      <div class="input-group">
        <label class="input-label">Team ID</label>
        <input class="input" type="text" id="team-id" placeholder="e.g. alpha, beta …" autocomplete="username" />
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="team-pw" placeholder="Team password" autocomplete="current-password" />
      </div>
      <div class="err" id="team-err"></div>
      <button class="btn btn-blue btn-full" style="margin-top:8px" onclick="teamLogin()">Enter Dashboard →</button>
    </div>

    <!-- ADMIN LOGIN -->
    <div class="login-card">
      <span class="login-card-icon">⚙️</span>
      <h2>Admin Panel</h2>
      <p id="admin-sub">Auctioneer access for Room A</p>
      <div class="input-group" style="margin-top:20px">
        <label class="input-label">Admin Password</label>
        <input class="input" type="password" id="admin-pw" placeholder="Enter admin password" autocomplete="current-password" />
      </div>
      <div class="err" id="admin-err"></div>
      <button class="btn btn-amber btn-full" style="margin-top:8px" onclick="adminLogin()">Open Admin Panel →</button>
    </div>

  </div>

  <div class="display-links">
    <a href="/display?room=a" target="_blank" class="btn btn-ghost btn-sm">📺 Room A Display</a>
    <a href="/display?room=b" target="_blank" class="btn btn-ghost btn-sm">📺 Room B Display</a>
  </div>

</div>
</div>
<div id="toast"></div>
<script src="/assets/js/prism.js"></script>
<script>
let selectedRoom = 'a';

// Read room from URL if present
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom === 'a' || urlRoom === 'b') selectRoom(urlRoom);

// Auto-redirect if already logged in
PRISM.get('/api/auth/me').then(me => {
  if (me.role === 'admin') location.href = `/admin?room=${me.roomId || 'a'}`;
  if (me.role === 'team')  location.href = `/team?room=${me.roomId  || 'a'}`;
});

function selectRoom(r) {
  selectedRoom = r;
  document.getElementById('btn-a').className = 'room-btn' + (r === 'a' ? ' active' : '');
  document.getElementById('btn-b').className = 'room-btn' + (r === 'b' ? ' active' : '');
  document.getElementById('team-sub').textContent  = `Room ${r.toUpperCase()} teams — enter your team ID and password`;
  document.getElementById('admin-sub').textContent = `Auctioneer access for Room ${r.toUpperCase()}`;
}

async function teamLogin() {
  const teamId   = document.getElementById('team-id').value.trim().toLowerCase();
  const password = document.getElementById('team-pw').value;
  const err      = document.getElementById('team-err');
  err.textContent = '';
  if (!teamId || !password) { err.textContent = 'Enter team ID and password'; return; }
  const r = await PRISM.post('/api/auth/team-login', { teamId, password, room: selectedRoom });
  if (r.success) {
    PRISM.toast(`Welcome, ${r.teamName}!`, 'success');
    setTimeout(() => location.href = `/team?room=${selectedRoom}`, 600);
  } else { err.textContent = r.message; }
}

async function adminLogin() {
  const password = document.getElementById('admin-pw').value;
  const err      = document.getElementById('admin-err');
  err.textContent = '';
  if (!password) { err.textContent = 'Enter admin password'; return; }
  const r = await PRISM.post('/api/auth/admin-login', { password, room: selectedRoom });
  if (r.success) {
    PRISM.toast('Access granted', 'success');
    setTimeout(() => location.href = `/admin?room=${selectedRoom}`, 600);
  } else { err.textContent = r.message; }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = document.activeElement?.id;
  if (id === 'admin-pw') adminLogin();
  else if (id === 'team-pw' || id === 'team-id') teamLogin();
});
</script>
</body>
</html>
